name: macrofinance
description: "MacroFinance — Progressive Cash Loan Platform (Max ₹50,000)"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (Riverpod 2.x)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Biometric Auth
  local_auth: ^2.3.0

  # UI / Design
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  pin_code_fields: ^8.0.1
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1

  # Security
  safe_device: ^1.1.7

  # Icons
  cupertino_icons: ^1.0.8
  flutter_feather_icons: ^2.0.0+1

  # Data Classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
